<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Duby</title>
  <!-- Vinculación con la hoja de estilos externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Elemento de Audio de Fondo -->
  <audio id="bg-music" loop>
    <source src="mi-vida-entera-piano.mp3" type="audio/mpeg">
  </audio>

  <!-- Botón Flotante para Control del Audio -->
  <div class="audio-badge" id="music-toggle">
    <span>🎵 Mi Vida Entera (Piano)</span>
  </div>

  <!-- Contenedor Principal con las Cartas -->
  <div class="cards-container">
    <div class="card">
      <h2>✉️ Carta #1</h2>
      <p>Escribe aquí el contenido de la primera carta dedicada...</p>
    </div>

    <div class="card">
      <h2>✉️ Carta #2</h2>
      <p>Escribe aquí el contenido de la segunda carta dedicada...</p>
    </div>

    <div class="card">
      <h2>✉️ Carta #3</h2>
      <p>Escribe aquí el contenido de la tercera carta dedicada...</p>
    </div>
  </div>

  <!-- Vinculación con el archivo de código JavaScript -->
  <script src="script.js"></script>
</body>
</html>
